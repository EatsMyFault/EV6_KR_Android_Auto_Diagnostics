name: EV6 Android Auto 진단 결과 제보
description: 진단 모드 설치 문제와 Android Auto 안내 데이터 수신 결과를 제보합니다.
title: "[진단 제보] "
body:
  - type: markdown
    attributes:
      value: |
        설치와 로그 확인 방법은 [진단 가이드](https://github.com/EatsMyFault/EV6_KR_Android_Auto_Diagnostics/blob/main/README.md)를 참고해 주세요. 안내 데이터가 정상 수신된 경우도 제보할 수 있습니다.

        이슈는 공개됩니다. 로그와 사진을 첨부하기 전에 VIN, 번호판, 기기 식별 정보, 전화번호, 위치와 목적지를 가려 주세요.
  - type: input
    id: firmware
    attributes:
      label: 차량 내비 소프트웨어 버전
      description: 차량 설정의 SW 정보에 표시되는 전체 버전을 적어 주세요. 확인이 어렵다면 모름이라고 적어 주세요.
      placeholder: "예시 CVEV.KOR.0000.V039.001.260902"
    validations:
      required: true
  - type: input
    id: diagnostic-version
    attributes:
      label: EV6 Android Auto 진단 모드 버전
      description: 설치를 완료하지 못했다면 받은 ZIP의 버전을 적어 주세요.
      placeholder: "예시 v0.1.0"
    validations:
      required: true
  - type: input
    id: hmg-api-version
    attributes:
      label: HMG-API 버전
      description: HMG-API 앱 상단의 버전과 Hooks 상태를 적어 주세요. 앱을 열 수 없다면 모름이라고 적어 주세요.
      placeholder: "예시 1.0.2 / Hooks on"
    validations:
      required: true
  - type: dropdown
    id: connection-type
    attributes:
      label: 휴대폰 연결 방식
      options:
        - 차량 데이터 USB에 직접 연결
        - USB 어댑터 또는 AI 박스를 통해 연결
        - 무선 Android Auto
        - 연결 전 단계 또는 모름
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 확인한 단계
      options:
        - USB에서 설치 ZIP 확인
        - 모드 설치 또는 적용
        - Android Auto 연결 또는 초기화
        - 길안내 시작 또는 다음 회전으로 전환
        - 경로 재탐색
        - 길안내 취소 또는 종료
        - 기타
    validations:
      required: true
  - type: input
    id: navigation-app
    attributes:
      label: 지도 앱
      description: 길안내를 테스트했다면 사용한 앱을 적어 주세요.
      placeholder: "예시 네이버지도, 티맵, 카카오내비, Google 지도"
  - type: textarea
    id: steps
    attributes:
      label: 테스트 또는 재현 절차
      description: 무엇을 했고 결과가 반복되는지 적어 주세요. 어댑터를 사용했다면 제품명과 차량 화면에 열린 연결 방식도 적어 주세요.
      placeholder: "예시 안드로이드폰을 차량 데이터 USB에 직결하고 Android Auto에서 티맵 길안내를 시작한 뒤, 첫 회전을 확인하고 안내를 종료했습니다."
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 실제 결과와 기대한 동작
      description: Android Auto 화면의 길안내 상태와 진단 로그 수신 여부를 적어 주세요. GPM_READY와 AA_NAV_INIT이 보이면 값도 적어 주세요.
      placeholder: "예시 Android Auto에서 길안내가 진행됐습니다. GPM_READY hooks=7/7과 AA_NAV_INIT cluster=IMAGE result=true가 보였고, AA_TURN과 AA_DISTANCE는 없었습니다."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그 또는 사진
      description: 정차 후 HMG-API의 Mods에서 EV6 KOR Android Auto Diagnostics를 선택해 Log의 AA_DIAG_010 줄을 확인해 주세요. 설치 오류 문구를 붙여 넣거나 개인정보를 가린 로그 파일과 사진을 첨부할 수 있습니다.
      placeholder: "GPM_READY, AA_NAV_INIT, AA_STATUS, AA_TURN, AA_DISTANCE, AA_DISCONNECTED 중 보이는 줄을 붙여 넣어 주세요."
